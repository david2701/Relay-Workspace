name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android Gradle checks
        working-directory: apps/android
        run: |
          set -euo pipefail
          if [[ ! -f ./gradlew ]]; then
            echo "ERROR: apps/android Gradle project is required but ./gradlew is missing."
            exit 1
          fi
          chmod +x ./gradlew
          echo "Running: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease"
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --console=plain
          echo "Android Gradle tasks finished (:app:lintDebug :app:testDebugUnitTest :app:assembleRelease)."

  apple:
    name: apple
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apple checks
        run: |
          set -euo pipefail
          if [[ ! -d apps/apple ]]; then
            echo "ERROR: apps/apple is required but the directory is missing."
            exit 1
          fi
          echo "=== Swift package tests ==="
          found_pkg=0
          while IFS= read -r -d '' package_swift; do
            found_pkg=1
            package_dir="$(dirname "$package_swift")"
            echo "swift test in ${package_dir}"
            (cd "$package_dir" && swift test)
          done < <(find apps/apple -name Package.swift -print0)
          if [[ "${found_pkg}" -eq 0 ]]; then
            echo "ERROR: no Package.swift under apps/apple."
            exit 1
          fi
          if [[ ! -d apps/apple/Relay.xcodeproj ]]; then
            echo "ERROR: apps/apple/Relay.xcodeproj is required but missing."
            exit 1
          fi
          echo "=== xcodebuild (iOS Simulator) ==="
          xcodebuild \
            -project apps/apple/Relay.xcodeproj \
            -scheme RelayiOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcode-ios.log
          grep -q "BUILD SUCCEEDED" /tmp/xcode-ios.log
          echo "xcodebuild RelayiOS: BUILD SUCCEEDED"
          echo "=== xcodebuild (macOS) ==="
          xcodebuild \
            -project apps/apple/Relay.xcodeproj \
            -scheme RelayMac \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcode-mac.log
          grep -q "BUILD SUCCEEDED" /tmp/xcode-mac.log
          echo "xcodebuild RelayMac: BUILD SUCCEEDED"
          echo "=== Widget / extension schemes (if any) ==="
          widget_schemes="$(xcodebuild -project apps/apple/Relay.xcodeproj -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print} f&&!NF{exit}' | grep -Ei 'Widget|Extension' || true)"
          if [[ -z "${widget_schemes}" ]]; then
            echo "No widget/extension schemes present; nothing extra to build."
          else
            while IFS= read -r scheme; do
              [[ -z "${scheme}" ]] && continue
              echo "Building scheme: ${scheme}"
              xcodebuild \
                -project apps/apple/Relay.xcodeproj \
                -scheme "${scheme}" \
                -destination 'generic/platform=iOS Simulator' \
                -configuration Debug \
                CODE_SIGNING_ALLOWED=NO \
                build | tee "/tmp/xcode-${scheme}.log"
              grep -q "BUILD SUCCEEDED" "/tmp/xcode-${scheme}.log"
              echo "xcodebuild ${scheme}: BUILD SUCCEEDED"
            done <<< "${widget_schemes}"
          fi

      - name: Capture Apple screenshots
        env:
          RELAY_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/apple-screenshots
        run: |
          set -euo pipefail
          chmod +x apps/apple/scripts/capture-screenshots.sh
          apps/apple/scripts/capture-screenshots.sh

      - name: Upload Apple screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-screenshots
          path: artifacts/apple-screenshots/*.png
          if-no-files-found: error
